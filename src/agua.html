<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="icono.png">
<style>[hidden]{display:none!important}</style>
<title>Kenti Calidad de Agua</title>
<meta name="description" content="Kenti Calidad de Agua / Kenti Water Quality: comparación de análisis de agua con niveles guía de Argentina, Japón, OMS, UE, EE.UU., Canadá, Australia y FAO, con parámetros opcionales, ICA del CCME y conversor de unidades.">
<style>
@font-face{font-family:"Public Sans";src:url(fuentes/PublicSans-Regular.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Public Sans";src:url(fuentes/PublicSans-Medium.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Public Sans";src:url(fuentes/PublicSans-SemiBold.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Public Sans";src:url(fuentes/PublicSans-Bold.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Source Serif 4";src:url(fuentes/SourceSerif4-Roman.woff2) format("woff2");font-weight:200 900;font-style:normal;font-display:swap}
@font-face{font-family:"Source Serif 4";src:url(fuentes/SourceSerif4-Italic.woff2) format("woff2");font-weight:200 900;font-style:italic;font-display:swap}
@font-face{font-family:"IBM Plex Mono";src:url(fuentes/IBMPlexMono-Regular.woff2) format("woff2");font-weight:400 500;font-display:swap}
html{-webkit-text-size-adjust:100%}
</style>
<style>
/*{{BASE_CSS}}*/
/*{{AGUA_CSS}}*/
</style>
</head>
<body>
<div class="wrap">
  <header class="app-head">
    <div class="brand">
      <img src="icono.png" alt="" width="78" height="78">
      <div>
        <div class="wordmark">Kenti <em data-en="Water quality">Calidad de agua</em></div>
        <div class="meta"><span data-en="Guideline values from Argentina, Japan, WHO, EU, US, Canada, Australia and FAO · CCME WQI">Niveles guía de Argentina, Japón, OMS, UE, EE.UU., Canadá, Australia y FAO · ICA del CCME</span> <span class="chip soft">v{{VERSION}}</span></div>
      </div>
    </div>
    <div class="actions">
      <input type="file" id="file-xlsx" accept=".xlsx" hidden>
      <div class="seg lang" role="group" aria-label="Idioma / Language"><button type="button" data-lang="es" title="Español">ES</button><button type="button" data-lang="en" title="English">EN</button></div>
      <button class="btn primary" id="btn-export" type="button" data-en="Export to Excel">Exportar a Excel</button>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-p="datos" aria-selected="true"><span class="n">1</span><span data-en="Data">Datos</span></button>
    <button class="tab" role="tab" data-p="eval" aria-selected="false"><span class="n">2</span><span data-en="Regulatory assessment">Evaluación normativa</span></button>
    <button class="tab" role="tab" data-p="ica" aria-selected="false"><span class="n">3</span><span data-en="WQI">ICA</span></button>
    <button class="tab" role="tab" data-p="iones" aria-selected="false"><span class="n">4</span><span data-en="Ions and derived">Iones y derivados</span></button>
    <button class="tab" role="tab" data-p="conv" aria-selected="false"><span class="n">5</span><span data-en="Converter">Conversor</span></button>
    <button class="tab" role="tab" data-p="ctl" aria-selected="false"><span class="n">6</span><span data-en="Checks">Controles</span> <span class="badge" id="ctl-badge" hidden></span></button>
    <button class="tab" role="tab" data-p="normas" aria-selected="false"><span class="n">7</span><span data-en="Standards and criteria">Normas y criterios</span></button>
  </nav>

  <section class="panel" id="p-datos"></section>
  <section class="panel" id="p-eval" hidden></section>
  <section class="panel" id="p-ica" hidden></section>
  <section class="panel" id="p-iones" hidden></section>
  <section class="panel" id="p-conv" hidden></section>
  <section class="panel" id="p-ctl" hidden></section>
  <section class="panel" id="p-normas" hidden></section>

  <footer class="muted" style="font-size:12.5px; margin-top:40px; display:flex; gap:14px; flex-wrap:wrap; justify-content:space-between">
    <span id="save-state" data-en="No changes">Sin cambios</span>
    <span><button class="btn ghost" id="btn-folder" type="button" hidden data-en="Open data folder">Abrir carpeta de datos</button> <span data-en="Developed by Kenti">Desarrollado por Kenti</span></span>
  </footer>
</div>
<div id="dlg" hidden></div>
<div id="tip" hidden></div>
<div id="toast" hidden></div>
<script>
const VERSION = "{{VERSION}}";
/*{{APP_JS}}*/
</script>
</body>
</html>
